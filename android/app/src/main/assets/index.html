<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECI NDX Scanner</title>
<script src="tess/tesseract.min.js"></script>
<style>
  :root {
    --green: #27ae60;
    --red: #e74c3c;
    --blue: #2980b9;
    --dark: #1a252f;
    --light: #f0f3f4;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: var(--dark);
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    background: #111;
    padding: 14px 16px;
    text-align: center;
    border-bottom: 2px solid var(--blue);
  }
  header h1 { font-size: 18px; color: white; }
  header p { font-size: 12px; color: #aaa; margin-top: 3px; }

  .badge {
    background: var(--blue);
    color: white;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    display: inline-block;
    margin-top: 4px;
  }

  /* Camera area */
  .cam-wrap {
    width: 100%;
    max-width: 480px;
    position: relative;
    background: #000;
    aspect-ratio: 4/3;
    overflow: hidden;
  }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .scan-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .scan-box {
    width: 80%;
    height: 60px;
    border: 2px solid rgba(255,255,0,0.8);
    border-radius: 6px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.35);
    position: relative;
  }
  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: rgba(255,255,0,0.9);
    animation: scanAnim 1.5s ease-in-out infinite;
  }
  @keyframes scanAnim {
    0% { top: 0; }
    50% { top: calc(100% - 2px); }
    100% { top: 0; }
  }
  .scan-hint {
    position: absolute;
    bottom: 8px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  canvas { display: none; }

  /* Controls */
  .controls {
    width: 100%;
    max-width: 480px;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn-scan {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: var(--blue);
    color: white;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: background 0.2s;
  }
  .btn-scan:active { background: #1a6fa0; }
  .btn-scan:disabled { background: #555; color: #999; }

  /* Result */
  .result-box {
    width: 100%;
    max-width: 480px;
    margin: 0 16px;
    border-radius: 12px;
    padding: 18px 20px;
    text-align: center;
    display: none;
    animation: popIn 0.3s ease;
  }
  @keyframes popIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .result-box.match {
    background: var(--green);
    display: block;
  }
  .result-box.no-match {
    background: #555;
    display: block;
  }
  .result-box.error {
    background: #8e44ad;
    display: block;
  }
  .result-box.near {
    background: #d68910;
    display: block;
  }
  .result-raw {
    font-size: 12px;
    opacity: 0.9;
    margin-top: 6px;
  }
  .result-icon { font-size: 42px; }
  .result-ndx { font-size: 22px; font-weight: bold; margin: 8px 0 4px; letter-spacing: 1px; }
  .result-msg { font-size: 15px; opacity: 0.95; }
  .result-action {
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 8px 12px;
  }

  /* Processing */
  .processing {
    display: none;
    text-align: center;
    padding: 16px;
    color: #aaa;
    font-size: 14px;
    width: 100%;
    max-width: 480px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 4px solid #333;
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Manual input */
  .manual-section {
    width: 100%;
    max-width: 480px;
    padding: 0 16px 12px;
  }
  .manual-section label {
    font-size: 12px;
    color: #aaa;
    display: block;
    margin-bottom: 5px;
  }
  .manual-row {
    display: flex;
    gap: 8px;
  }
  .manual-input {
    flex: 1;
    padding: 11px 12px;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #2c3e50;
    color: white;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .manual-input::placeholder { color: #666; text-transform: none; }
  .btn-check {
    padding: 11px 16px;
    background: #8e44ad;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }

  /* History */
  .history-section {
    width: 100%;
    max-width: 480px;
    padding: 0 16px 20px;
  }
  .history-title {
    font-size: 12px;
    color: #888;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .btn-clear { font-size: 11px; color: #e74c3c; background: none; border: none; cursor: pointer; }
  .history-list { display: flex; flex-direction: column; gap: 5px; }
  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #2c3e50;
    border-radius: 7px;
    padding: 8px 12px;
    font-size: 13px;
  }
  .history-item .ndx { font-weight: bold; letter-spacing: 0.5px; }
  .history-item .tag {
    font-size: 11px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .tag.match { background: var(--green); }
  .tag.no-match { background: #555; }

  /* List view */
  .list-toggle {
    width: 100%;
    max-width: 480px;
    padding: 0 16px 8px;
  }
  .btn-list {
    width: 100%;
    padding: 10px;
    background: #2c3e50;
    color: #aaa;
    border: 1px solid #444;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    text-align: center;
  }
  .ndx-list-panel {
    display: none;
    width: 100%;
    max-width: 480px;
    padding: 0 16px 16px;
  }
  .ndx-list-panel.open { display: block; }
  .ndx-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
  }
  .ndx-chip {
    background: #2c3e50;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    color: #ccc;
    text-align: center;
    font-weight: bold;
  }
</style>
</head>
<body>

<header>
  <h1>📋 ECI NDX Scanner</h1>
  <p>BLO Verification 2026 — Not Collected Checker</p>
  <span class="badge">35 NDX Numbers Loaded</span>
</header>

<!-- Camera -->
<div class="cam-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="scan-overlay">
    <div class="scan-box">
      <div class="scan-line"></div>
    </div>
    <div class="scan-hint">Point NDX number inside the box</div>
  </div>
</div>

<!-- Scan button -->
<div class="controls">
  <button class="btn-scan" id="btnScan" onclick="captureAndScan()">📷 SCAN NDX NUMBER</button>
</div>

<!-- Processing -->
<div class="processing" id="processing">
  <div class="spinner"></div>
  Reading NDX number...
</div>

<!-- Result -->
<div class="result-box" id="resultBox">
  <div class="result-icon" id="resultIcon"></div>
  <div class="result-ndx" id="resultNdx"></div>
  <div class="result-msg" id="resultMsg"></div>
  <div class="result-action" id="resultAction"></div>
</div>

<!-- Manual input -->
<div class="manual-section">
  <label>Or type NDX number manually:</label>
  <div class="manual-row">
    <input class="manual-input" id="manualInput" type="text" placeholder="e.g. NDX1234567" maxlength="12">
    <button class="btn-check" onclick="manualCheck()">CHECK</button>
  </div>
</div>

<!-- History -->
<div class="history-section" id="historySection" style="display:none">
  <div class="history-title">
    <span>Recent Scans</span>
    <button class="btn-clear" onclick="clearHistory()">Clear</button>
  </div>
  <div class="history-list" id="historyList"></div>
</div>

<!-- Full list toggle -->
<div class="list-toggle">
  <button class="btn-list" onclick="toggleList()">📋 View All 35 Not Collected NDX Numbers</button>
</div>
<div class="ndx-list-panel" id="ndxListPanel">
  <div class="ndx-grid" id="ndxGrid"></div>
</div>

<script>
// ============ NDX NOT COLLECTED LIST ============
const NOT_COLLECTED = new Set([
  "NDX0437749","NDX0439695","NDX0441279","NDX0442079","NDX0443697",
  "NDX0445635","NDX0464511","NDX0529487","NDX0683615","NDX0696732",
  "NDX0697094","NDX1085950","NDX1092972","NDX1093012","NDX1093111",
  "NDX1308162","NDX1486241","NDX2344349","NDX2347144","NDX2347490",
  "NDX2347714","NDX2683993","NDX2691038","NDX2696466","NDX2712149",
  "NDX2718633","NDX2826154","NDX2826204","NDX2832889","NDX2948727",
  "NDX3116845","NDX3524907","NDX3526258","NDX3595360","NDX3982584"
]);

let history = loadHistory();
let scanning = false;

// ============ CAMERA SETUP ============
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 960 }
      }
    });
    video.srcObject = stream;
  } catch(e) {
    console.error('Camera error:', e);
    document.querySelector('.cam-wrap').innerHTML =
      '<div style="padding:40px;text-align:center;color:#aaa;font-size:14px;">📷 Camera not available.<br>Use manual input below.</div>';
  }
}

// ============ OFFLINE OCR WORKER ============
// Everything below is bundled inside the APK (assets/tess), so OCR works
// with no internet connection at all.
let ocrWorker = null;
let ocrWorkerPromise = null;

function getOcrWorker() {
  if (ocrWorker) return Promise.resolve(ocrWorker);
  if (ocrWorkerPromise) return ocrWorkerPromise;
  ocrWorkerPromise = (async () => {
    const worker = await Tesseract.createWorker('eng', 1, {
      workerPath: 'tess/worker.min.js',
      corePath: 'tess/',
      langPath: 'tess/',
      // Shipped uncompressed: the Android build gunzips .gz assets and drops
      // the extension, so a .gz here would never be found at runtime.
      gzip: false,
      cacheMethod: 'none'
    });
    // No character whitelist: it makes Tesseract force every blob into an
    // allowed glyph, which hurts more than it helps. Lookalikes are mapped
    // afterwards in digitsOnly() instead.
    await worker.setParameters({ tessedit_pageseg_mode: '7' });
    currentPsm = '7';
    ocrWorker = worker;
    return worker;
  })();
  return ocrWorkerPromise;
}

let currentPsm = null;
async function ocrRecognize(image, psm) {
  const worker = await getOcrWorker();
  if (psm && psm !== currentPsm) {
    await worker.setParameters({ tessedit_pageseg_mode: psm });
    currentPsm = psm;
  }
  return worker.recognize(image);
}

// Warm the OCR engine up in the background so the first scan is not slow.
window.addEventListener('load', () => { getOcrWorker().catch(e => console.error('OCR init failed', e)); });

// ============ CAPTURE & OCR ============
// The scan box the user aims with is a DOM element laid over a video that is
// drawn with `object-fit: cover`, so the on-screen box does not map 1:1 onto
// the camera frame. Work out the matching rectangle in video pixels.
function getScanRectInVideoCoords() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;

  const vRect = video.getBoundingClientRect();
  const bRect = document.querySelector('.scan-box').getBoundingClientRect();
  if (!vRect.width || !vRect.height) return null;

  // `cover` scales by the larger ratio and centres the overflow.
  const scale = Math.max(vRect.width / vw, vRect.height / vh);
  const offX = (vRect.width - vw * scale) / 2;
  const offY = (vRect.height - vh * scale) / 2;

  let x = (bRect.left - vRect.left - offX) / scale;
  let y = (bRect.top - vRect.top - offY) / scale;
  let w = bRect.width / scale;
  let h = bRect.height / scale;

  // Breathing room, mostly vertical: the number often sits a little high or
  // low in the box without the user noticing.
  const padX = w * 0.04, padY = h * 0.35;
  x -= padX; y -= padY; w += padX * 2; h += padY * 2;

  x = Math.max(0, Math.min(x, vw - 1));
  y = Math.max(0, Math.min(y, vh - 1));
  w = Math.min(w, vw - x);
  h = Math.min(h, vh - y);
  return { x, y, w, h };
}

/** Draw a region of the frame scaled up, as greyscale, ready for thresholding. */
function buildCrop(rect, zoom) {
  const c = document.createElement('canvas');
  c.width = Math.round(rect.w * zoom);
  c.height = Math.round(rect.h * zoom);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(canvas, rect.x, rect.y, rect.w, rect.h, 0, 0, c.width, c.height);
  return c;
}

/** Otsu's method: pick the threshold that best splits ink from paper. */
function otsuThreshold(hist, total) {
  let sum = 0;
  for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = 0, bestVar = -1;
  for (let t = 0; t < 256; t++) {
    wB += hist[t];
    if (wB === 0) continue;
    const wF = total - wB;
    if (wF === 0) break;
    sumB += t * hist[t];
    const mB = sumB / wB;
    const mF = (sum - sumB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if (between > bestVar) { bestVar = between; best = t; }
  }
  return best;
}

/**
 * Preprocess in place.
 *   'gray'   – greyscale with the contrast stretched; keeps faint strokes.
 *   'otsu'   – binarised at an image-derived threshold, not a fixed 128.
 *   'invert' – binarised and inverted, for light text on a dark background.
 */
function preprocess(ctx, mode) {
  const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height);
  const d = img.data;
  const hist = new Uint32Array(256);
  const gray = new Uint8ClampedArray(d.length / 4);

  for (let i = 0, g = 0; i < d.length; i += 4, g++) {
    // Rec. 601 luma: closer to perceived brightness than a flat average.
    const v = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
    gray[g] = v;
    hist[v]++;
  }

  if (mode === 'gray') {
    // Stretch the middle 98% of the range so paper goes white and ink black.
    const total = gray.length;
    let lo = 0, hi = 255, acc = 0;
    for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > total * 0.01) { lo = i; break; } }
    acc = 0;
    for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > total * 0.01) { hi = i; break; } }
    const span = Math.max(1, hi - lo);
    for (let i = 0, g = 0; i < d.length; i += 4, g++) {
      const v = Math.max(0, Math.min(255, ((gray[g] - lo) * 255) / span));
      d[i] = d[i + 1] = d[i + 2] = v;
    }
  } else {
    const t = otsuThreshold(hist, gray.length);
    const on = mode === 'invert' ? 255 : 0;
    const off = mode === 'invert' ? 0 : 255;
    for (let i = 0, g = 0; i < d.length; i += 4, g++) {
      const v = gray[g] < t ? on : off;
      d[i] = d[i + 1] = d[i + 2] = v;
    }
  }
  ctx.putImageData(img, 0, 0);
}

async function captureAndScan() {
  if (scanning) return;
  scanning = true;

  const btn = document.getElementById('btnScan');
  btn.disabled = true;
  document.getElementById('resultBox').style.display = 'none';
  document.getElementById('processing').style.display = 'block';

  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const box = getScanRectInVideoCoords();
  const full = { x: 0, y: 0, w: canvas.width, h: canvas.height };

  // Cheapest, most likely passes first; each is only run if the last found
  // nothing usable, so a clean scan still returns quickly.
  const attempts = [];
  if (box) {
    attempts.push({ rect: box, zoom: 3, mode: 'otsu', psm: '7' });
    attempts.push({ rect: box, zoom: 3, mode: 'gray', psm: '7' });
    attempts.push({ rect: box, zoom: 4, mode: 'otsu', psm: '6' });
    attempts.push({ rect: box, zoom: 3, mode: 'invert', psm: '7' });
  }
  attempts.push({ rect: full, zoom: 2, mode: 'gray', psm: '6' });
  attempts.push({ rect: full, zoom: 2, mode: 'otsu', psm: '6' });

  let fallback = null;

  try {
    for (const a of attempts) {
      const c = buildCrop(a.rect, a.zoom);
      preprocess(c.getContext('2d', { willReadFrequently: true }), a.mode);

      const result = await ocrRecognize(c, a.psm);
      const found = extractNDX(result.data.text);
      if (!found) continue;

      // An exact hit on the list is as good as it gets - stop here.
      if (NOT_COLLECTED.has(found.ndx)) {
        showResult(found.ndx, found.corrected);
        return;
      }
      // Otherwise keep the first plausible read and let the other passes try
      // to do better before we commit to it.
      if (!fallback) fallback = found;
    }

    if (fallback) {
      showResult(fallback.ndx, fallback.corrected);
    } else {
      showError('Could not read the NDX number.\nHold steady, fill the yellow box with the number, then try again.');
    }
  } catch(e) {
    console.error('OCR failed', e);
    showError('OCR failed. Please type the NDX number manually.');
  } finally {
    document.getElementById('processing').style.display = 'none';
    btn.disabled = false;
    scanning = false;
  }
}

// ============ NDX PARSING ============
// Letters Tesseract commonly returns in place of digits on printed forms.
const DIGIT_LOOKALIKES = {
  O: '0', Q: '0', D: '0', U: '0',
  I: '1', L: '1', T: '1', '|': '1', '!': '1',
  Z: '2', E: '3', A: '4', H: '4',
  S: '5', $: '5', G: '6', C: '6', B: '8', R: '8',
  P: '9', J: '3', Y: '7'
};

function digitsOnly(chunk) {
  let out = '';
  for (const ch of chunk) {
    if (ch >= '0' && ch <= '9') out += ch;
    else if (DIGIT_LOOKALIKES[ch]) out += DIGIT_LOOKALIKES[ch];
    else return null;
  }
  return out;
}

/** Levenshtein distance, capped - we only care about "is this within 1?". */
function editDistance(a, b) {
  if (Math.abs(a.length - b.length) > 1) return 99;
  const m = a.length, n = b.length;
  let prev = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(
        prev[j] + 1,
        cur[j - 1] + 1,
        prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
    prev = cur;
  }
  return prev[n];
}

/**
 * Pull an NDX number out of raw OCR text.
 * Returns {ndx, corrected} or null. `corrected` means the exact characters
 * read were not on the list but sat one character away from an entry, so the
 * result needs a human to confirm it rather than being trusted outright.
 */
function extractNDX(text) {
  const up = (text || '').toUpperCase();
  const compact = up.replace(/[^A-Z0-9|!$]/g, '');
  const candidates = [];

  // Prefix, tolerating an N/D/X that came back as something else.
  const prefixed = compact.matchAll(/(?:NDX|ND[X%]|N0X|MDX|HDX)([A-Z0-9|!$]{7})/g);
  for (const m of prefixed) {
    const digits = digitsOnly(m[1]);
    if (digits) candidates.push(digits);
  }

  // Bare 7-digit runs - the prefix is constant, so it is not worth losing a
  // read over. Longer runs are windowed in case a stray digit got attached.
  for (const m of compact.matchAll(/[0-9]{7,9}/g)) {
    const run = m[0];
    for (let i = 0; i + 7 <= run.length; i++) candidates.push(run.slice(i, i + 7));
  }

  if (!candidates.length) return null;

  // Prefer an exact list hit, then a one-character near miss, then whatever
  // we read first.
  for (const c of candidates) {
    if (NOT_COLLECTED.has('NDX' + c)) return { ndx: 'NDX' + c, corrected: false };
  }
  for (const c of candidates) {
    for (const known of NOT_COLLECTED) {
      if (editDistance('NDX' + c, known) === 1) {
        return { ndx: known, corrected: true, raw: 'NDX' + c };
      }
    }
  }
  return { ndx: 'NDX' + candidates[0], corrected: false };
}

// ============ RESULT DISPLAY ============
function showResult(ndx, corrected) {
  const isMatch = NOT_COLLECTED.has(ndx);
  const box = document.getElementById('resultBox');

  // A corrected read was one character off a listed number. It is probably
  // right, but "probably" is not good enough to act on unprompted, so it gets
  // its own colour and asks the user to confirm against the form.
  box.className = 'result-box ' + (corrected ? 'near' : (isMatch ? 'match' : 'no-match'));
  document.getElementById('resultIcon').textContent =
    corrected ? '🔍' : (isMatch ? '✅' : '➡️');
  document.getElementById('resultNdx').textContent = ndx;
  document.getElementById('resultMsg').textContent = corrected
    ? 'Close match — check this against the form'
    : (isMatch ? 'Found in Not Collected list!' : 'Not in Not Collected list');
  document.getElementById('resultAction').textContent = corrected
    ? '❓ CONFIRM, THEN SEPARATE'
    : (isMatch ? '📂 SEPARATE THIS FORM' : '📋 KEEP IN BUNDLE');
  box.style.display = 'block';
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });

  addHistory(ndx, isMatch, corrected);
  vibrate(isMatch);
}

function showError(msg) {
  const box = document.getElementById('resultBox');
  box.className = 'result-box error';
  document.getElementById('resultIcon').textContent = '⚠️';
  document.getElementById('resultNdx').textContent = 'Not Detected';
  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('resultAction').textContent = 'Try again or type manually';
  box.style.display = 'block';
}

// ============ MANUAL CHECK ============
function manualCheck() {
  let val = document.getElementById('manualInput').value.trim().toUpperCase();
  if (!val) return;

  // Auto-add NDX prefix if missing
  if (/^\d{7}$/.test(val)) val = 'NDX' + val;
  if (!val.startsWith('NDX')) val = 'NDX' + val.replace(/^NDX/i, '');

  document.getElementById('manualInput').value = '';
  showResult(val, false);
}

document.getElementById('manualInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') manualCheck();
});

// ============ VIBRATE ============
function vibrate(isMatch) {
  if (!navigator.vibrate) return;
  if (isMatch) {
    navigator.vibrate([100, 50, 100, 50, 200]); // strong for match
  } else {
    navigator.vibrate(80); // light for no match
  }
}

// ============ HISTORY ============
function addHistory(ndx, isMatch, corrected) {
  history.unshift({ ndx, isMatch, corrected: !!corrected, time: new Date().toLocaleTimeString() });
  if (history.length > 20) history.pop();
  saveHistory();
  renderHistory();
}

function renderHistory() {
  const section = document.getElementById('historySection');
  const list = document.getElementById('historyList');
  if (history.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  list.innerHTML = history.map(h => `
    <div class="history-item">
      <span class="ndx">${h.ndx}</span>
      <span style="color:#aaa;font-size:11px">${h.time}</span>
      <span class="tag ${h.isMatch ? 'match' : 'no-match'}">${h.isMatch ? 'SEPARATE' : 'KEEP'}${h.corrected ? '?' : ''}</span>
    </div>
  `).join('');
}

function clearHistory() {
  history = [];
  saveHistory();
  renderHistory();
}

function saveHistory() {
  try { localStorage.setItem('ndxHistory', JSON.stringify(history)); } catch(e) {}
}

function loadHistory() {
  try {
    const raw = localStorage.getItem('ndxHistory');
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

// ============ NDX LIST PANEL ============
function toggleList() {
  const panel = document.getElementById('ndxListPanel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open') && !document.getElementById('ndxGrid').innerHTML) {
    document.getElementById('ndxGrid').innerHTML = [...NOT_COLLECTED].sort().map(n =>
      `<div class="ndx-chip">${n}</div>`
    ).join('');
  }
}

// ============ INIT ============
renderHistory();
startCamera();
</script>
