name: Build ECI NDX Scanner APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default package set still asks for the retired "tools" package,
          # which sdkmanager no longer serves.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Test NDX parsing
        run: node android/tools/test-ndx-parsing.js

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      # Park the built APK on its own single-commit branch so it can be pulled
      # with plain git, without going through the Actions artifact store.
      - name: Push APK to the apk-build branch
        run: |
          workdir=$(mktemp -d)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$workdir/ECI-NDX-Scanner.apk"
          cd "$workdir"
          echo "Debug APK of the ECI NDX Scanner, built from ${{ github.sha }}." > README.md
          git init -q
          git checkout -q -b apk-build
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -q -m "ECI NDX Scanner debug APK from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eci-ndx-scanner-debug
          path: android/app/build/outputs/apk/debug/*.apk
